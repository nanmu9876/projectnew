<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄钟</title>
<style>
  :root {
    --focus: #e5534b;
    --short: #2f9e8f;
    --long: #3b6fd8;
    --accent: var(--focus);
    --bg: #fbf7f4;
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #8a8580;
    --line: #ece6e1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: url('bg.jpg') center/cover fixed;
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    transition: background .4s;
  }
  .app { width: 100%; max-width: 440px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: rgba(251, 247, 244, 0.3); padding: 12px 16px; border-radius: 8px; }
  h1 { font-size: 20px; font-weight: 600; }
  .icon-btn {
    background: none; border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; cursor: pointer; color: var(--muted); font-size: 14px;
  }
  .icon-btn:hover { color: var(--text); }

  .card { background: rgba(255, 255, 255, 0.92); border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.08); margin-bottom: 16px; }

  .modes { display: flex; gap: 6px; background: var(--bg); padding: 4px; border-radius: 10px; }
  .modes button {
    flex: 1; border: none; background: none; padding: 8px 0; border-radius: 8px;
    cursor: pointer; font-size: 14px; color: var(--muted);
  }
  .modes button.active { background: var(--card); color: var(--accent); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.08); }

  .ring-wrap { position: relative; width: 260px; height: 260px; margin: 28px auto 20px; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-bg { stroke: var(--line); }
  .ring-fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .3s linear, stroke .4s; }
  .time {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .time .digits { font-size: 60px; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  .time .label { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .controls { display: flex; justify-content: center; align-items: center; gap: 14px; }
  .btn-main {
    background: var(--accent); color: #fff; border: none; border-radius: 999px;
    width: 140px; height: 48px; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: transform .1s, background .4s;
  }
  .btn-main:active { transform: scale(.97); }
  .btn-sub {
    background: var(--bg); border: none; border-radius: 999px; width: 48px; height: 48px;
    cursor: pointer; font-size: 18px; color: var(--muted);
  }
  .btn-sub:hover { color: var(--text); }

  .dots { display: flex; justify-content: center; gap: 6px; margin-top: 18px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .dot.done { background: var(--focus); }

  h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: baseline; }
  h2 small { font-weight: 400; color: var(--muted); font-size: 12px; }

  .task-input { display: flex; gap: 8px; margin-bottom: 10px; }
  .task-input input {
    flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14px; outline: none;
  }
  .task-input input:focus { border-color: var(--accent); }
  .task-input button { border: none; background: var(--accent); color: #fff; border-radius: 8px; padding: 0 14px; cursor: pointer; }
  ul { list-style: none; }
  li.task {
    display: flex; align-items: center; gap: 10px; padding: 9px 8px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent;
  }
  li.task:hover { background: var(--bg); }
  li.task.current { border-color: var(--accent); }
  li.task input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }
  li.task .name { flex: 1; font-size: 14px; word-break: break-all; }
  li.task.done .name { text-decoration: line-through; color: var(--muted); }
  li.task .count { font-size: 12px; color: var(--muted); }
  li.task .del { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 16px; visibility: hidden; }
  li.task:hover .del { visibility: visible; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 10px 0; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
  .stat .num { font-size: 22px; font-weight: 600; }
  .stat .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .week { display: flex; align-items: flex-end; gap: 8px; height: 80px; margin-top: 18px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .bar { width: 100%; max-width: 24px; background: var(--focus); border-radius: 4px 4px 0 0; min-height: 2px; opacity: .85; }
  .bar-col span { font-size: 11px; color: var(--muted); }

  /* 设置弹窗 */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-bg.show { display: flex; }
  .modal { background: var(--card); border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; }
  .modal h3 { margin-bottom: 16px; font-size: 17px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; }
  .row input[type=number] { width: 70px; border: 1px solid var(--line); border-radius: 6px; padding: 6px; text-align: center; font-size: 14px; }
  .row input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .modal-actions button { border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 14px; }
  .modal-actions .save { background: var(--accent); color: #fff; }
  .modal-actions .cancel { background: var(--bg); }
  .hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🍅 番茄钟</h1>
    <button class="icon-btn" id="openSettings">⚙ 设置</button>
  </header>

  <div class="card">
    <div class="modes">
      <button data-mode="focus" class="active">专注</button>
      <button data-mode="short">短休息</button>
      <button data-mode="long">长休息</button>
    </div>

    <div class="ring-wrap">
      <svg width="260" height="260">
        <circle class="ring-bg" cx="130" cy="130" r="118" fill="none" stroke-width="10"/>
        <circle class="ring-fg" id="ring" cx="130" cy="130" r="118" fill="none" stroke-width="10"/>
      </svg>
      <div class="time">
        <div class="digits" id="digits">25:00</div>
        <div class="label" id="label">准备开始专注</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-sub" id="resetBtn" title="重置 (R)">↺</button>
      <button class="btn-main" id="startBtn">开始</button>
      <button class="btn-sub" id="skipBtn" title="跳过 (S)">⏭</button>
    </div>
    <div class="dots" id="dots"></div>
    <div class="hint">空格 开始/暂停 · R 重置 · S 跳过</div>
  </div>

  <div class="card">
    <h2>任务 <small>点击任务设为当前</small></h2>
    <div class="task-input">
      <input id="taskInput" placeholder="添加一个任务，回车确认" maxlength="60">
      <button id="addTask">添加</button>
    </div>
    <ul id="taskList"></ul>
  </div>

  <div class="card">
    <h2>统计</h2>
    <div class="stats">
      <div class="stat"><div class="num" id="todayCount">0</div><div class="lbl">今日番茄</div></div>
      <div class="stat"><div class="num" id="todayMin">0</div><div class="lbl">今日专注(分)</div></div>
      <div class="stat"><div class="num" id="totalCount">0</div><div class="lbl">累计番茄</div></div>
    </div>
    <div class="week" id="week"></div>
  </div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>设置</h3>
    <div class="row"><label>专注时长（分钟）</label><input type="number" id="setFocus" min="1" max="180"></div>
    <div class="row"><label>短休息（分钟）</label><input type="number" id="setShort" min="1" max="60"></div>
    <div class="row"><label>长休息（分钟）</label><input type="number" id="setLong" min="1" max="120"></div>
    <div class="row"><label>长休息间隔（个番茄）</label><input type="number" id="setInterval" min="1" max="12"></div>
    <div class="row"><label>自动开始休息</label><input type="checkbox" id="setAutoBreak"></div>
    <div class="row"><label>自动开始专注</label><input type="checkbox" id="setAutoFocus"></div>
    <div class="row"><label>提示音</label><input type="checkbox" id="setSound"></div>
    <div class="row"><label>桌面通知</label><input type="checkbox" id="setNotify"></div>
    <div class="modal-actions">
      <button class="cancel" id="cancelSettings">取消</button>
      <button class="save" id="saveSettings">保存</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const MODES = {
    focus: { name: '专注', color: '--focus' },
    short: { name: '短休息', color: '--short' },
    long:  { name: '长休息', color: '--long' },
  };
  const DEFAULTS = { focus: 25, short: 5, long: 15, interval: 4, autoBreak: false, autoFocus: false, sound: true, notify: true };

  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));

  let settings = { ...DEFAULTS, ...load('pomo.settings', {}) };
  let tasks = load('pomo.tasks', []);           // [{id, name, done, count}]
  let currentTaskId = load('pomo.current', null);
  let history = load('pomo.history', {});       // { 'YYYY-MM-DD': { count, minutes } }

  let mode = 'focus';
  let cycle = 0;           // 本轮已完成的专注数
  let total = settings.focus * 60;
  let remaining = total;
  let running = false;
  let endAt = 0;
  let ticker = null;

  const R = 118, CIRC = 2 * Math.PI * R;
  const ring = $('ring');
  ring.style.strokeDasharray = CIRC;

  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

  function render() {
    $('digits').textContent = fmt(remaining);
    ring.style.strokeDashoffset = CIRC * (1 - remaining / total);
    $('startBtn').textContent = running ? '暂停' : (remaining < total ? '继续' : '开始');
    const task = tasks.find(t => t.id === currentTaskId && !t.done);
    $('label').textContent = running
      ? (mode === 'focus' ? (task ? `正在专注：${task.name}` : '专注中…') : '休息一下吧')
      : (mode === 'focus' ? '准备开始专注' : `准备${MODES[mode].name}`);
    document.title = running ? `${fmt(remaining)} · ${MODES[mode].name}` : '番茄钟';
  }

  function renderDots() {
    $('dots').innerHTML = Array.from({ length: settings.interval },
      (_, i) => `<div class="dot ${i < cycle ? 'done' : ''}"></div>`).join('');
  }

  function setMode(m, autoStart = false) {
    stop();
    mode = m;
    total = remaining = settings[m] * 60;
    document.documentElement.style.setProperty('--accent', `var(${MODES[m].color})`);
    document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
    render();
    if (autoStart) start();
  }

  function start() {
    if (running) return;
    running = true;
    endAt = Date.now() + remaining * 1000;
    ticker = setInterval(tick, 250);
    render();
  }

  function stop() {
    running = false;
    clearInterval(ticker);
    render();
  }

  // 基于时间戳计算，避免后台标签页计时漂移
  function tick() {
    const left = Math.max(0, Math.round((endAt - Date.now()) / 1000));
    if (left !== remaining) { remaining = left; render(); }
    if (left <= 0) finish();
  }

  function finish() {
    stop();
    if (settings.sound) beep();
    if (mode === 'focus') {
      const day = today();
      history[day] = history[day] || { count: 0, minutes: 0 };
      history[day].count++;
      history[day].minutes += settings.focus;
      save('pomo.history', history);
      const task = tasks.find(t => t.id === currentTaskId);
      if (task) { task.count++; save('pomo.tasks', tasks); renderTasks(); }
      cycle++;
      const next = cycle >= settings.interval ? 'long' : 'short';
      notify('专注完成 🍅', `做得好！开始${MODES[next].name}吧。`);
      renderStats();
      renderDots();
      setMode(next, settings.autoBreak);
    } else {
      notify('休息结束', '准备好开始下一个番茄了吗？');
      if (mode === 'long') cycle = 0;
      renderDots();
      setMode('focus', settings.autoFocus);
    }
  }

  function skip() {
    if (mode === 'focus') {
      setMode(cycle + 1 >= settings.interval ? 'long' : 'short');
    } else {
      if (mode === 'long') cycle = 0;
      renderDots();
      setMode('focus');
    }
  }

  // 提示音：使用 Web Audio，无需外部文件
  let audioCtx;
  function beep() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.35, 0.7].forEach(offset => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.value = 880;
        const t = audioCtx.currentTime + offset;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
        o.connect(g).connect(audioCtx.destination);
        o.start(t); o.stop(t + 0.32);
      });
    } catch {}
  }

  function notify(title, body) {
    if (!settings.notify || !('Notification' in window)) return;
    if (Notification.permission === 'granted') new Notification(title, { body });
  }

  // ---------- 任务 ----------
  function renderTasks() {
    const ul = $('taskList');
    if (!tasks.length) { ul.innerHTML = '<div class="empty">还没有任务，添加一个开始专注吧</div>'; return; }
    ul.innerHTML = '';
    tasks.forEach(t => {
      const li = document.createElement('li');
      li.className = 'task' + (t.done ? ' done' : '') + (t.id === currentTaskId ? ' current' : '');
      li.innerHTML = `<input type="checkbox" ${t.done ? 'checked' : ''}>
        <span class="name"></span><span class="count">🍅 ${t.count}</span><button class="del" title="删除">×</button>`;
      li.querySelector('.name').textContent = t.name;
      li.querySelector('input').addEventListener('click', e => {
        e.stopPropagation();
        t.done = e.target.checked;
        save('pomo.tasks', tasks); renderTasks(); render();
      });
      li.querySelector('.del').addEventListener('click', e => {
        e.stopPropagation();
        tasks = tasks.filter(x => x.id !== t.id);
        if (currentTaskId === t.id) currentTaskId = null;
        save('pomo.tasks', tasks); save('pomo.current', currentTaskId); renderTasks(); render();
      });
      li.addEventListener('click', () => {
        currentTaskId = currentTaskId === t.id ? null : t.id;
        save('pomo.current', currentTaskId); renderTasks(); render();
      });
      ul.appendChild(li);
    });
  }

  function addTask() {
    const name = $('taskInput').value.trim();
    if (!name) return;
    const t = { id: Date.now(), name, done: false, count: 0 };
    tasks.push(t);
    if (!currentTaskId) currentTaskId = t.id;
    $('taskInput').value = '';
    save('pomo.tasks', tasks); save('pomo.current', currentTaskId);
    renderTasks(); render();
  }

  // ---------- 统计 ----------
  function renderStats() {
    const d = history[today()] || { count: 0, minutes: 0 };
    $('todayCount').textContent = d.count;
    $('todayMin').textContent = d.minutes;
    $('totalCount').textContent = Object.values(history).reduce((s, x) => s + x.count, 0);

    const days = [];
    for (let i = 6; i >= 0; i--) {
      const dt = new Date(); dt.setDate(dt.getDate() - i);
      const key = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      days.push({ label: i === 0 ? '今天' : '日一二三四五六'[dt.getDay()], count: history[key]?.count || 0 });
    }
    const max = Math.max(1, ...days.map(x => x.count));
    $('week').innerHTML = days.map(x =>
      `<div class="bar-col" title="${x.count} 个番茄"><div class="bar" style="height:${(x.count / max) * 60}px"></div><span>${x.label}</span></div>`
    ).join('');
  }

  // ---------- 设置 ----------
  const fields = { focus: 'setFocus', short: 'setShort', long: 'setLong', interval: 'setInterval' };
  const checks = { autoBreak: 'setAutoBreak', autoFocus: 'setAutoFocus', sound: 'setSound', notify: 'setNotify' };

  function openSettings() {
    for (const [k, id] of Object.entries(fields)) $(id).value = settings[k];
    for (const [k, id] of Object.entries(checks)) $(id).checked = settings[k];
    $('modal').classList.add('show');
  }
  function saveSettings() {
    for (const [k, id] of Object.entries(fields)) {
      const v = parseInt($(id).value, 10);
      if (v > 0) settings[k] = v;
    }
    for (const [k, id] of Object.entries(checks)) settings[k] = $(id).checked;
    save('pomo.settings', settings);
    if (settings.notify && 'Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    $('modal').classList.remove('show');
    if (cycle >= settings.interval) cycle = 0;
    renderDots();
    if (!running) setMode(mode);
  }

  // ---------- 事件绑定 ----------
  $('startBtn').addEventListener('click', () => {
    if (settings.notify && 'Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    running ? stop() : start();
  });
  $('resetBtn').addEventListener('click', () => setMode(mode));
  $('skipBtn').addEventListener('click', skip);
  document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => {
    if (running && !confirm('计时进行中，确定切换吗？')) return;
    setMode(b.dataset.mode);
  }));
  $('addTask').addEventListener('click', addTask);
  $('taskInput').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
  $('openSettings').addEventListener('click', openSettings);
  $('cancelSettings').addEventListener('click', () => $('modal').classList.remove('show'));
  $('saveSettings').addEventListener('click', saveSettings);
  $('modal').addEventListener('click', e => { if (e.target.id === 'modal') $('modal').classList.remove('show'); });

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || $('modal').classList.contains('show')) return;
    if (e.code === 'Space') { e.preventDefault(); $('startBtn').click(); }
    else if (e.key === 'r' || e.key === 'R') setMode(mode);
    else if (e.key === 's' || e.key === 'S') skip();
  });

  window.addEventListener('beforeunload', e => { if (running) { e.preventDefault(); e.returnValue = ''; } });

  setMode('focus');
  renderDots();
  renderTasks();
  renderStats();
})();
</script>
</body>
</html>
